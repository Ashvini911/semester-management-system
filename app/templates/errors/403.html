{% extends "base.html" %}
{% block title %}Access denied · Semester Management{% endblock %}
{% block body %}
  <section class="error-card">
    <p class="eyebrow">403 · Access denied</p>
    <h1>You do not have permission to view this page.</h1>
    <p class="muted">Your account role cannot access this action.</p>
    <a class="button button-primary" href="{{ url_for('dashboard.index') if session.get('role') else url_for('auth.login') }}">Return</a>
  </section>
{% endblock %}
