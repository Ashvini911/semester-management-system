{% extends "base.html" %}{% block title %}Academic Staff{% endblock %}
{% block head %}<link rel="stylesheet" href="{{ url_for('staff.css') }}">{% endblock %}
{% block body %}
<div class="card"><h1>{{ "Edit" if editing else "Add" }} Academic Staff</h1>
<form method="post">
<label>Staff ID
<input name="Staff_ID" type="text" value="{{ row["Staff_ID"] if row["Staff_ID"] is not none }}" required {% if editing %}readonly{% endif %}></label>
<label>First Name
<input name="First_Name" type="text" value="{{ row["First_Name"] if row["First_Name"] is not none }}" required></label>
<label>Last Name
<input name="Last_Name" type="text" value="{{ row["Last_Name"] if row["Last_Name"] is not none }}" required></label>
<label>Email
<input name="Email" type="email" value="{{ row["Email"] if row["Email"] is not none }}" required></label>
<label>Contact No
<input name="Contact_No" type="text" value="{{ row["Contact_No"] if row["Contact_No"] is not none }}"></label>
<label>Type
<select name="Staff_Type" required><option value="">Select…</option>{% for o in lookups["Staff_Type"] %}<option value="{{ o }}" {{ "selected" if o|string == row["Staff_Type"]|string }}>{{ o }}</option>{% endfor %}</select></label>
<label>Employment
<select name="Employment"><option value="">— none —</option>{% for o in lookups["Employment"] %}<option value="{{ o }}" {{ "selected" if o|string == row["Employment"]|string }}>{{ o }}</option>{% endfor %}</select></label>
<div class="bar"><button>Save</button><a href="{{ url_for('staff.index') }}">Cancel</a></div>
</form></div>
{% endblock %}
