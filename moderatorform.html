{% extends "base.html" %}{% block title %}Moderators{% endblock %}
{% block head %}<link rel="stylesheet" href="{{ url_for('moderators.css') }}">{% endblock %}
{% block body %}
<div class="card"><h1>{{ "Edit" if editing else "Add" }} Moderators</h1>
<form method="post">
<label>Email
<input name="Email" type="email" value="{{ row["Email"] if row["Email"] is not none }}" required {% if editing %}readonly{% endif %}></label>
<label>First Name
<input name="First_Name" type="text" value="{{ row["First_Name"] if row["First_Name"] is not none }}" required></label>
<label>Last Name
<input name="Last_Name" type="text" value="{{ row["Last_Name"] if row["Last_Name"] is not none }}" required></label>
<label>Contact No
<input name="Contact_No" type="text" value="{{ row["Contact_No"] if row["Contact_No"] is not none }}"></label>
<label>Address
<input name="Official_Address" type="text" value="{{ row["Official_Address"] if row["Official_Address"] is not none }}"></label>
<label>Designation
<input name="Designation" type="text" value="{{ row["Designation"] if row["Designation"] is not none }}"></label>
<div class="bar"><button>Save</button><a href="{{ url_for('moderators.index') }}">Cancel</a></div>
</form></div>
{% endblock %}
