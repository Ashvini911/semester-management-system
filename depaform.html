{% extends "base.html" %}{% block title %}Departments{% endblock %}
{% block head %}<link rel="stylesheet" href="{{ url_for('departments.css') }}">{% endblock %}
{% block body %}
<div class="card"><h1>{{ "Edit" if editing else "Add" }} Departments</h1>
<form method="post">
<label>Department
<input name="Dep_Name" type="text" value="{{ row["Dep_Name"] if row["Dep_Name"] is not none }}" required {% if editing %}readonly{% endif %}></label>
<label>HOD Email
<select name="Email" required><option value="">Select…</option>{% for o in lookups["Email"] %}<option value="{{ o }}" {{ "selected" if o|string == row["Email"]|string }}>{{ o }}</option>{% endfor %}</select></label>
<div class="bar"><button>Save</button><a href="{{ url_for('departments.index') }}">Cancel</a></div>
</form></div>
{% endblock %}
