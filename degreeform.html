{% extends "base.html" %}{% block title %}Degrees{% endblock %}
{% block head %}<link rel="stylesheet" href="{{ url_for('degrees.css') }}">{% endblock %}
{% block body %}
<div class="card"><h1>{{ "Edit" if editing else "Add" }} Degrees</h1>
<form method="post">
<label>Degree
<input name="Degree_Name" type="text" value="{{ row["Degree_Name"] if row["Degree_Name"] is not none }}" required {% if editing %}readonly{% endif %}></label>
<label>Credits
<input name="Credit" type="number" value="{{ row["Credit"] if row["Credit"] is not none }}" required></label>
<label>Years
<input name="Duration" type="number" value="{{ row["Duration"] if row["Duration"] is not none }}" required></label>
<label>Department
<select name="Dep_Name" required><option value="">Select…</option>{% for o in lookups["Dep_Name"] %}<option value="{{ o }}" {{ "selected" if o|string == row["Dep_Name"]|string }}>{{ o }}</option>{% endfor %}</select></label>
<div class="bar"><button>Save</button><a href="{{ url_for('degrees.index') }}">Cancel</a></div>
</form></div>
{% endblock %}
